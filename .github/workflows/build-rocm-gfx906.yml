name: Build ROCm GFX906

on:
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push image to GHCR"
        required: true
        type: boolean
        default: true
      rocm_version:
        description: "ROCm version (base image tag)"
        required: true
        type: string
        default: "6.3.4"
      rocm_libs_version:
        description: "ROCm libs branch version for rocBLAS/Tensile/RCCL (empty = same as rocm_version)"
        required: false
        type: string
        default: "6.3.3"

concurrency:
  group: build-rocm-gfx906-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      push_images: ${{ steps.vars.outputs.push_images }}
      base_rocm_image: ${{ steps.vars.outputs.base_rocm_image }}
      rocm_image_ref: ${{ steps.vars.outputs.rocm_image_ref }}
    steps:
      - name: Compute variables
        id: vars
        shell: bash
        run: |
          ROCM_VERSION="${{ inputs.rocm_version || '6.3.4' }}"
          OWNER="${{ github.repository_owner }}"
          {
            echo "push_images=${{ inputs.push_images != false }}"
            echo "base_rocm_image=rocm/dev-ubuntu-24.04:${ROCM_VERSION}-complete"
            echo "rocm_image_ref=ghcr.io/${OWNER}/rocm-gfx906:${ROCM_VERSION}-complete"
          } >> "${GITHUB_OUTPUT}"

  build-rocm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          docker system prune -af
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ROCm image
        uses: docker/build-push-action@v6
        with:
          context: ./rocm/submodules
          file: ./rocm/rocm.Dockerfile
          target: final
          push: ${{ needs.prepare.outputs.push_images == 'true' }}
          tags: ${{ needs.prepare.outputs.rocm_image_ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          build-args: |
            BASE_ROCM_IMAGE=${{ needs.prepare.outputs.base_rocm_image }}
            ROCM_ARCH=gfx906
            ROCM_LIBS_VERSION=${{ inputs.rocm_libs_version || '6.3.3' }}
          cache-from: |
            type=gha,scope=rocm-gfx906
            type=registry,ref=${{ needs.prepare.outputs.rocm_image_ref }}-cache
          cache-to: |
            type=gha,mode=max,scope=rocm-gfx906
