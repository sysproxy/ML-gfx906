name: Build vLLM GFX906

on:
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push image to GHCR"
        required: true
        type: boolean
        default: true
      rocm_version:
        description: "ROCm version (for PyTorch image tag)"
        required: true
        type: string
        default: "6.3.4"
      pytorch_branch:
        description: "PyTorch tag (must match existing pytorch-gfx906 image)"
        required: true
        type: string
        default: "v2.9.1"
      amdsmi_version:
        description: "amdsmi PyPI version (use 6.3.3 when rocm is 6.3.4)"
        required: false
        type: string
        default: "6.3.3"
      triton_repo:
        description: "Triton repo URL"
        required: true
        type: string
        default: "https://github.com/ai-infos/triton-gfx906.git"
      triton_branch:
        description: "Triton git tag/branch"
        required: true
        type: string
        default: "v3.5.1+gfx906"
      vllm_repo:
        description: "vLLM repo URL"
        required: true
        type: string
        default: "https://github.com/ai-infos/vllm-gfx906-mobydick.git"
      vllm_branch:
        description: "vLLM git tag/branch"
        required: true
        type: string
        default: "main"
      smoke_test:
        description: "Run smoke test after build"
        required: false
        type: boolean
        default: true

concurrency:
  group: build-vllm-gfx906-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      push_images: ${{ steps.vars.outputs.push_images }}
      pytorch_image_ref: ${{ steps.vars.outputs.pytorch_image_ref }}
      vllm_image_ref: ${{ steps.vars.outputs.vllm_image_ref }}
    steps:
      - name: Compute variables
        id: vars
        shell: bash
        run: |
          ROCM_VERSION="${{ inputs.rocm_version || '6.3.4' }}"
          PYTORCH_BRANCH="${{ inputs.pytorch_branch || 'v2.9.1' }}"
          PYTORCH_TAG="${PYTORCH_BRANCH#v}"
          OWNER="${{ github.repository_owner }}"
          {
            echo "push_images=${{ inputs.push_images != false }}"
            echo "pytorch_image_ref=ghcr.io/${OWNER}/pytorch-gfx906:v${PYTORCH_TAG}-rocm-${ROCM_VERSION}"
            echo "vllm_image_ref=ghcr.io/${OWNER}/vllm-gfx906:latest"
          } >> "${GITHUB_OUTPUT}"

  build-vllm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          docker system prune -af
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push vLLM image
        uses: docker/build-push-action@v6
        with:
          context: ./vllm/submodules
          file: ./vllm/vllm.Dockerfile
          target: final
          push: ${{ needs.prepare.outputs.push_images == 'true' }}
          tags: ${{ needs.prepare.outputs.vllm_image_ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          build-args: |
            BASE_PYTORCH_IMAGE=${{ needs.prepare.outputs.pytorch_image_ref }}
            AMDSMI_VERSION=${{ inputs.amdsmi_version || '6.3.3' }}
            VLLM_REPO=${{ inputs.vllm_repo }}
            VLLM_BRANCH=${{ inputs.vllm_branch }}
            TRITON_REPO=${{ inputs.triton_repo }}
            TRITON_BRANCH=${{ inputs.triton_branch }}
          cache-from: |
            type=gha,scope=vllm-gfx906
            type=registry,ref=${{ needs.prepare.outputs.vllm_image_ref }}-cache
          cache-to: |
            type=gha,mode=max,scope=vllm-gfx906

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - prepare
      - build-vllm
    if: ${{ inputs.smoke_test && needs.prepare.outputs.push_images == 'true' }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test vLLM image
        run: |
          IMAGE="${{ needs.prepare.outputs.vllm_image_ref }}"
          echo "Testing image: ${IMAGE}"
          docker pull "${IMAGE}"
          docker run --rm --entrypoint python "${IMAGE}" -c \
            "import torch, vllm; print('torch', torch.__version__); print('vllm', vllm.__version__)"
